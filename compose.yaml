services:
  # --- 共通データベース (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    restart: always
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bot_user} -d $${POSTGRES_DB:-attendance_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 音声合成エンジン (VOICEVOX) ---
  voicebox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    restart: unless-stopped
    ports:
      - "50021:50021"

  # --- ドア解錠・音声通知 Bot ---
  door_bot:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: always
    working_dir: /app/bots/door_bot
    volumes:
      - ./:/app
      - /dev:/dev
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
    environment:
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      PULSE_COOKIE: /run/user/1000/pulse/cookie
    privileged: true
    network_mode: host
    command: ["python", "bot.py"]
    depends_on:
      - voicebox

  # --- 出席管理 Bot ---
  attendance_bot:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: always
    working_dir: /app/bots/attendance_bot
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot_user}:${POSTGRES_PASSWORD:-bot_password}@localhost:5432/${POSTGRES_DB:-attendance_bot}
    network_mode: host
    command: ["python", "main.py"]
    depends_on:
      db:
        condition: service_healthy

  # --- 汎用・便利機能用 Bot (画像自動転送など) ---
  utils_bot:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: always
    working_dir: /app/bots/utils_bot
    volumes:
      - ./:/app
    network_mode: host
    command: ["python", "bot.py"]

  # --- Arduino / マイコン ファームウェア書き込みツール (手動実行用) ---
  pio:
    profiles:
      - pio
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    working_dir: /app
    volumes:
      - ./:/app
      - /dev/bus/usb:/dev/bus/usb
      - pio_cache:/root/.platformio
      - uv_cache:/root/.cache/uv
    tty: true
    privileged: true
    network_mode: host
    command: ["pio", "run", "-d", "firmware/door_lock", "-t", "upload"]

volumes:
  pio_cache:
  uv_cache:
  postgres_data:
