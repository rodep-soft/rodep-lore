services:
  sphinx:
    # これは必要なときだけ手動ビルド
    profiles:
      - tools
    build:
      context: .
      # Dockerfileは共通化
      dockerfile: Dockerfile
    working_dir: /app

    # bind mount
    volumes:
      - ./:/app
      # コンテナ内の.venv消える？
      # これはやばい可能性がある
      - /app/.venv

    # firewalld/iptables等に注意
    # hostでListenしてるか見る
    # $ sudo ss -plunt | grep 8080
    #
    ports:
      - "8080:8080"

    # この書き方が安定かも
    command:
      - uv
      - run
      - sphinx-autobuild
      - docs/source
      - docs/build/html
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  # arduino制御
  # docker compose --profile setup logs
  pio:
    profiles:
      - setup
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    working_dir: /app

    volumes:
      - ./:/app
      - /app/.venv
      - /dev/bus/usb:/dev/bus/usb
      - pio_cache:/root/.platformio
      - uv_cache:/root/.cache/uv

    tty: true
    privileged: true
    network_mode: host
    command:
      - uv
      - run
      - pio
      - run
      - -d
      - bot
      - -t
      - upload

  # discord botのメインのコンテナ
  door_bot:
    profiles:
      - setup
    build:
      context: .
      dockerfile: Dockerfile
      network: host

    working_dir: /app

    volumes:
      - ./:/app
      - /app/.venv
      - /dev:/dev
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native



    env_file:
      - ./door_bot/.env
  
        #devices:
        #- "/dev/doorduino:/dev/doorduino"

    environment:
      # コンテナ内のアプリにソケットの場所を教える
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - PULSE_COOKIE=/run/user/1000/pulse/cookie # 必要に応じて
    
    tty: true
    privileged: true
    network_mode: host
    # systemdに管理を任せる
    restart: always
    command:
      - uv
      - run
      - door_bot/bot.py


  # 大会用などの出席管理bot
  attendance_bot:
    profiles:
      - setup
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    env_file:
      - ./attendance_bot/.env

    tty: true
    privileged: true
    network_mode: host

    working_dir: /app
    volumes:
      - ./attendance_bot:/app
      - /app/.venv
      - /dev:/dev
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
      

    restart: always
    command:
      - uv
      - run
      - attendance_bot/main.py
      

  # simは常駐で動かす
  # tailscale経由でアクセス可能
  # cloudflare tunnel越しにも公開している
  # /etc/systemd/system/cloudflared.service
  simulator:
    profiles:
      - voicebox
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    working_dir: /app


    volumes:
      - ./:/app
      - /app/.venv

    #network_mode: host
    ports:
      - "8501:8501"

    # メンテナンス時以外は自動復旧
    restart: unless-stopped

    command:
      - uv
      - run
      - streamlit
      - run
      - scripts/control/simple_pid_simulator.py
      - --server.address
      - "0.0.0.0"

  voicebox:
    profiles:
      - "setup"

    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "50021:50021"

    restart: unless-stopped



