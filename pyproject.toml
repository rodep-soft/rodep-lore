[project]
name = "rodep-lore"
version = "0.1.0"
description = "RODEP bots management repository"
readme = "README.md"
requires-python = ">=3.11.12"
dependencies = [
    "asyncpg>=0.29.0",
    "certifi>=2024.2.2",
    "discord>=2.3.2",
    "eclipse-zenoh>=1.7.1",
    "numpy>=2.0.0",
    "pillow>=10.2.0",
    "platformio>=6.1.18",
    "pyserial>=3.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "speedtest-cli>=2.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
