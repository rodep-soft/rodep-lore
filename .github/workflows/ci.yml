name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Check uv.lock sync
        run: uv lock --locked

      - name: Notify Discord
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993  # Green
            TITLE="✅ CI Passed: ${{ github.repository }}"
            DESC="All linting and format checks passed successfully!"
          else
            COLOR=15158332 # Red
            TITLE="❌ CI Failed: ${{ github.repository }}"
            DESC="Linting, format, or lockfile sync failed. Please check the logs."
          fi

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [
              {
                "title": "$TITLE",
                "description": "$DESC",
                "color": $COLOR,
                "fields": [
                  { "name": "Branch / Event", "value": "\`${{ github.ref_name }}\` (${{ github.event_name }})", "inline": true },
                  { "name": "Author", "value": "${{ github.actor }}", "inline": true },
                  { "name": "Commit", "value": "[\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})", "inline": false }
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
